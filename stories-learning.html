<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stories Learning by Kazi Riazul Hasan">
  <title>Stories Learning | Kazi Riazul Hasan</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at top, #2563eb 0, #0f172a 42%, #020617 100%);
    }
    .card {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: rgba(15, 23, 42, .72);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }
    .label { margin: 0 0 14px; color: #93c5fd; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.08; }
    .author { margin: 14px 0 30px; color: #cbd5e1; font-size: 1.1rem; }
    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      color: #0f172a;
      background: #f8fafc;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(147,197,253,.28); }
    .back { display: inline-block; margin-top: 24px; color: #bfdbfe; font-size: .9rem; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">Featured resource</p>
    <h1>Stories Learning</h1>
    <p class="author">by Kazi Riazul Hasan</p>
    <a class="button" href="https://sites.google.com/view/learningbyriazul/home" target="_blank" rel="noopener noreferrer">Visit Stories Learning ↗</a>
    <br>
    <a class="back" href="./">← Back to portfolio</a>
  </main>
</body>
</html>
